name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Server typecheck
        # `--` is required: without it npm eats -p (its own --parseable shorthand)
        # and --noEmit, so tsc gets tsconfig.json as a source file and fails.
        run: npm -w server exec -- tsc -p tsconfig.json --noEmit
      - name: Server unit tests
        run: npm -w server run test
      - name: Build (server + client)
        run: npm run build
